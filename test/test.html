<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DOMPurify XSS Prevention</title>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.5/dist/purify.min.js"></script>
</head>
<body>
  <h2>User Comment</h2>
 
  <textarea id="userInput" rows="4" cols="50" placeholder="Write something..."></textarea>
  <br>
  <button onclick="displayComment()">Submit</button>
 
  <h3>Unsanitized Output:</h3>
  <div id="output"></div>
 
  <script>
    function displayComment() {
      const rawInput = document.getElementById("userInput").value;
 
      document.getElementById("output").innerHTML = rawInput;
    }
  </script>
</body>
</html>
